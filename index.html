<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Name – 3D Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #0e0e0e;
  color: #fff;
  font-family: system-ui, sans-serif;
}

header {
  padding: 40px 20px;
  text-align: center;
}

#viewer {
  width: 100%;
  height: 500px;
  background: #111;
  border-radius: 16px;
  overflow: hidden;
  margin: 20px auto;
  max-width: 1100px;
}
</style>
</head>

<body>

<header>
  <h1>Your Name</h1>
  <p>Interactive Three.js Portfolio</p>
</header>

<div id="viewer"></div>

<script type="module">
import * as THREE from './three.module.js';
import { OrbitControls } from './OrbitControls.js';
import { GLTFLoader } from './GLTFLoader.js';

const container = document.getElementById('viewer');

function initThree() {
  // Force height for mobile
  container.style.height = '500px';

  if (!window.WebGLRenderingContext) {
    container.innerHTML = '<p style="color:white;padding:20px">WebGL not supported on this device.</p>';
    return;
  }

  const width = container.clientWidth;
  const height = container.clientHeight || 500;

  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  // Camera
  const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 100);
  camera.position.set(0, 0.5, 3); // pulled back for model visibility
  camera.lookAt(0,0,0);

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference:'high-performance' });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  container.appendChild(renderer.domElement);

  // Lights
  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 3);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 5);
  dir.position.set(5,5,5);
  scene.add(dir);

  // Red debug cube
  const cube = new THREE.Mesh(
    new THREE.BoxGeometry(0.5,0.5,0.5),
    new THREE.MeshStandardMaterial({ color:0xff0000 })
  );
  cube.position.set(0,0.25,0);
  scene.add(cube);

  // Controls
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = true;
  controls.enablePan = false;
  controls.rotateSpeed = 0.8;
  controls.zoomSpeed = 0.8;

  // Load 3D model
  const loader = new GLTFLoader();
  loader.load(
    'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/DamagedHelmet/glTF-Binary/DamagedHelmet.glb',
    (gltf) => {
      const model = gltf.scene;
      model.scale.set(2,2,2);      // scale up to be visible
      model.position.set(0,0,0);
      scene.add(model);
    },
    undefined,
    (err) => console.error(err)
  );

  // Animate
  function animate() {
    requestAnimationFrame(animate);
    cube.rotation.y += 0.01;
    controls.update();
    renderer.render(scene,camera);
  }
  animate();

  // Resize
  window.addEventListener('resize', ()=>{
    const w = container.clientWidth;
    const h = container.clientHeight || 500;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w,h);
  });
}

// Delay slightly after page load to ensure layout is ready
window.addEventListener('load', ()=>setTimeout(initThree,100));
</script>

</body>
</html>
