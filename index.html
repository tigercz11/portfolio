<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Name – 3D Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #0e0e0e;
            color: #fff;
            font-family: system-ui, sans-serif;
        }
        header {
            padding: 20px;
            text-align: center;
        }
        #viewer {
            width: 90%;
            height: 500px;
            background: #111;
            border-radius: 16px;
            overflow: hidden;
            margin: 20px auto;
            max-width: 1100px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

<header>
    <h1>Your Name</h1>
    <p>Interactive Three.js Portfolio</p>
</header>

<div id="viewer"></div>

<script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
    import { RGBELoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/RGBELoader.js';

    const container = document.getElementById('viewer');

    function initThree() {
        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        // Camera - Moved further back (z=10) to avoid being inside the model
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 2, 10);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        // Essential for modern Three.js and HDR
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);
        
        const spotLight = new THREE.SpotLight(0xffffff, 50);
        spotLight.position.set(5, 10, 5);
        scene.add(spotLight);

        // Load Environment Map (HDR)
        new RGBELoader()
            .setPath('https://rawcdn.githack.com/mrdoob/three.js/dev/examples/textures/equirectangular/')
            .load('royal_esplanade_1k.hdr', function (texture) {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.environment = texture;
                // Optional: set scene background to the HDR
                // scene.background = texture; 
            });

        // Load Model
        const loader = new GLTFLoader();
        // Using githack to bypass CORS issues
        const modelUrl = 'https://rawcdn.githack.com/KhronosGroup/glTF-Sample-Models/master/2.0/DamagedHelmet/glTF-Binary/DamagedHelmet.glb';
        
        loader.load(modelUrl, (gltf) => {
            const model = gltf.scene;
            model.scale.set(2.5, 2.5, 2.5); // Slightly smaller to fit view
            scene.add(model);
            
            // Remove the fallback cube once model loads
            scene.remove(cube); 
        }, 
        (xhr) => {
            console.log((xhr.loaded / xhr.total * 100) + '% loaded');
        },
        (error) => {
            console.error('An error happened', error);
        });

        // Fallback Cube
        const cube = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshStandardMaterial({ color: 0xff0000 })
        );
        scene.add(cube);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.y += 0.01;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Resize Handling
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    }

    // Initialize
    initThree();
</script>

</body>
</html>
