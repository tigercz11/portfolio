<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Portfolio – 3D Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #0e0e0e;
  color: #fff;
  font-family: system-ui, sans-serif;
}

header {
  padding: 40px 20px;
  text-align: center;
}

#viewer {
  width: 100%;
  height: 500px;
  background: #111;
  border-radius: 16px;
  overflow: hidden;
  margin: 20px auto;
  max-width: 1100px;
}
</style>
</head>

<body>

<header>
  <h1>Your Name</h1>
  <p>Three.js Portfolio (Webzdarma-safe)</p>
</header>

<div id="viewer"></div>

<script type="module">
import * as THREE from './three.module.js';
import { OrbitControls } from './OrbitControls.js';
import { GLTFLoader } from './GLTFLoader.js';

const container = document.getElementById('viewer');

// FORCE HEIGHT (CRITICAL FOR MOBILE)
container.style.height = '500px';

// Delay init until layout is ready
setTimeout(init, 100);

function init() {

  // WebGL support check
  if (!window.WebGLRenderingContext) {
    container.innerHTML = '<p style="color:white;padding:20px">WebGL not supported</p>';
    return;
  }

  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  // Camera
  const camera = new THREE.PerspectiveCamera(
    60,
    container.clientWidth / container.clientHeight,
    0.1,
    100
  );
  camera.position.set(0, 1, 4);

  // Renderer (FORCE GPU)
  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
  });

  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.appendChild(renderer.domElement);

  // Lights (extra bright for mobile)
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.5));

  const dirLight = new THREE.DirectionalLight(0xffffff, 3);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  // DEBUG cube (must appear)
  const cube = new THREE.Mesh(
    new THREE.BoxGeometry(),
    new THREE.MeshStandardMaterial({ color: 0xff0000 })
  );
  cube.position.y = 0.5;
  scene.add(cube);

  // Controls (touch friendly)
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = true;
  controls.enablePan = false;
  controls.rotateSpeed = 0.8;
  controls.zoomSpeed = 0.8;

  // Model
  const loader = new GLTFLoader();
  loader.load(
    'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/DamagedHelmet/glTF-Binary/DamagedHelmet.glb',
    (gltf) => {
      scene.add(gltf.scene);
    },
    undefined,
    (e) => console.error(e)
  );

  // Animate
  function animate() {
    requestAnimationFrame(animate);
    cube.rotation.y += 0.01;
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // Resize (mobile-safe)
  window.addEventListener('resize', () => {
    const w = container.clientWidth;
    const h = container.clientHeight || 500;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
}
</script>
</body>
</html>
