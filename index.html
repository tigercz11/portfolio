<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Portfolio Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #0e0e0e; color: white; font-family: sans-serif; }
        header { text-align: center; padding: 20px; }
        #viewer-container {
            position: relative;
            width: 90%;
            max-width: 1000px;
            height: 500px;
            margin: 0 auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
        }
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            pointer-events: none;
        }
    </style>
</head>
<body>

<header>
    <h1>3D Portfolio</h1>
    <p>Status: <span id="log">Initializing...</span></p>
</header>

<div id="viewer-container">
    <div id="status">Loading 3D Scene...</div>
    <div id="viewer" style="width:100%; height:100%;"></div>
</div>

<script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

    const statusText = document.getElementById('status');
    const logText = document.getElementById('log');

    function log(msg) { logText.innerText = msg; }

    try {
        const container = document.getElementById('viewer');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Simple Lights (No HDR needed)
        const ambientLight = new THREE.AmbientLight(0xffffff, 2);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 3);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // Add a spinning Cube immediately so we know it works
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        log("Three.js Running - Loading Model...");

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Load Model
        const loader = new GLTFLoader();
        // Use a more reliable CDN link for the model
        const modelUrl = 'https://rawcdn.githack.com/KhronosGroup/glTF-Sample-Models/master/2.0/DamagedHelmet/glTF-Binary/DamagedHelmet.glb';
        
        loader.load(modelUrl, (gltf) => {
            scene.remove(cube); // Remove cube once model loads
            const model = gltf.scene;
            model.scale.set(1.5, 1.5, 1.5);
            scene.add(model);
            statusText.style.display = 'none';
            log("Model Loaded Successfully");
        }, 
        undefined, 
        (error) => {
            console.error(error);
            log("Error loading model. Check console.");
            statusText.innerText = "Failed to load 3D Model";
        });

        function animate() {
            requestAnimationFrame(animate);
            if(cube) cube.rotation.y += 0.01;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

    } catch (e) {
        log("Critical Error: " + e.message);
    }
</script>

</body>
</html>
